<div class="container">
    <h1>Edit Trip</h1>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="code">Trip Code</label>
            <input type="text" id="code" class="form-control"
                   formControlName="code" readonly>
        </div>

        <div class="form-group">
            <label for="name">Trip Name</label>
            <input type="text" id="name" class="form-control"
                   formControlName="name">
        </div>

        <div class="form-group">
            <label for="length">Length</label>
            <input type="text" id="length" class="form-control"
                   formControlName="length">
        </div>

        <div class="form-group">
            <label for="start">Start Date</label>
            <input type="date" id="start" class="form-control"
                   formControlName="start">
        </div>

        <div class="form-group">
            <label for="resort">Resort</label>
            <input type="text" id="resort" class="form-control"
                   formControlName="resort">
        </div>

        <div class="form-group">
            <label for="perPerson">Price Per Person</label>
            <input type="text" id="perPerson" class="form-control"
                   formControlName="perPerson">
        </div>

        <div class="form-group">
            <label for="image">Image</label>
            <input type="text" id="image" class="form-control"
                   formControlName="image">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" class="form-control"
                      formControlName="description"></textarea>
        </div>

        <br>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

    </form>
</div>
