<div class="container">
    <div class="row">
        <div class="col-12">
            <button class="btn btn-info" (click)="addTrip()">Add Trip</button>
        </div>
    </div>

    <div class="row">
        @for (trip of trips; track trip.code) {
            <div class="col-md-4">
                <app-trip-card [trip]="trip"></app-trip-card>

                <button class="btn btn-warning" (click)="editTrip(trip.code)">
                    Edit Trip
                </button>
            </div>
        }
    </div>
</div>
