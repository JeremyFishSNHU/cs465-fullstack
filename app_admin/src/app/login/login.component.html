<div class="container">
  <h2>Travlr Getaways Admin Login</h2>

  <div *ngIf="formError" class="alert alert-danger">
    {{ formError }}
  </div>

  <form (ngSubmit)="onLoginSubmit()">
    <div>
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="credentials.email"
        required
      />
    </div>

    <div>
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="credentials.password"
        required
      />
    </div>

    <button type="submit">Login</button>
  </form>
</div>
